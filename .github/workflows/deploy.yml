name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "pyproject.toml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/socraticpath-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: project=socratic-path
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GHCR_READ_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/devanuhas/socraticpath-app:latest

            docker stop socratic-path-new 2>/dev/null || true
            docker rm socratic-path-new 2>/dev/null || true
            docker stop socratic-path 2>/dev/null || true
            docker rm socratic-path 2>/dev/null || true
            docker run -d \
              -p 127.0.0.1:8000:8000 \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              -e FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
              --memory=1.5g --memory-swap=2g --cpus=1.0 \
              --restart unless-stopped \
              --label project=socratic-path \
              --name socratic-path-new \
              ghcr.io/devanuhas/socraticpath-app:latest

            echo "Waiting for service to become ready (up to 180s)..."
            READY=0
            for i in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "Service is ready after $((i * 5))s."
                READY=1
                break
              fi
              if [ "$(docker inspect --format='{{.State.Status}}' socratic-path-new 2>/dev/null)" != "running" ]; then
                echo "ERROR: Container exited unexpectedly."
                docker logs --tail 50 socratic-path-new
                docker rm -f socratic-path-new
                exit 1
              fi
              echo "  Waiting... ($((i * 5))s elapsed)"
              sleep 5
            done

            if [ "$READY" != "1" ]; then
              echo "ERROR: Service did not become ready within 180s."
              docker logs --tail 50 socratic-path-new
              docker stop socratic-path-new
              docker rm -f socratic-path-new
              exit 1
            fi

            FINAL=$(docker inspect --format='{{.State.Status}}' socratic-path-new 2>/dev/null || echo "missing")
            if [ "$FINAL" != "running" ]; then
              echo "ERROR: Container is not running after wait. Aborting."
              docker stop socratic-path-new 2>/dev/null || true
              docker rm socratic-path-new 2>/dev/null || true
              exit 1
            fi

            # Cutover: stop the old container and rename the new one
            docker stop socratic-path || true
            docker rm socratic-path || true
            docker rename socratic-path-new socratic-path

            echo "Deploy successful."

            # Prune dangling images scoped to this project only (not all images on host)
            docker image prune -f --filter "label=project=socratic-path"
