# nginx reverse-proxy config for SocraticPath
#
# Setup steps (run on the Droplet):
#
#   1. Install nginx and Certbot:
#        apt-get install -y nginx certbot python3-certbot-nginx
#
#   2. Copy or symlink this file:
#        cp /root/socratic-path/nginx/socratic-path.conf /etc/nginx/sites-available/socratic-path
#        ln -s /etc/nginx/sites-available/socratic-path /etc/nginx/sites-enabled/socratic-path
#        rm -f /etc/nginx/sites-enabled/default
#
#   3. Replace every occurrence of "yourdomain.com" with your actual domain.
#
#   4. Test and reload nginx:
#        nginx -t && systemctl reload nginx
#
#   5. Obtain a TLS certificate (Certbot will fill in the ssl_* lines automatically):
#        certbot --nginx -d yourdomain.com
#
#   6. Ensure the Docker container binds only to localhost (already set in deploy.yml):
#        -p 127.0.0.1:8000:8000
#      This means port 8000 is NOT exposed publicly — all traffic goes through nginx.
#
# ------------------------------------------------------------------------------

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    server_name socraticpath.duckdns.org;  # <-- replace with your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name socraticpath.duckdns.org;  # <-- replace with your domain

    # Certbot will uncomment and populate the four lines below automatically.
    # Do not edit them manually after running certbot.
    # ssl_certificate      /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key  /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include              /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all requests to the FastAPI container (localhost only)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # T5 inference can take several seconds — avoid premature 504s.
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
    }
}
