[project]
name = "socratic-path"
version = "0.1.0"
description = "Socratic question generation with FLAN-T5 and LoRA fine-tuning"
requires-python = ">=3.10"

dependencies = [
    # Core ML inference
    "torch>=2.6.0",                    # 2.6+ required for CVE-2025-32434 safe checkpoint loading
    "transformers>=4.47.0",            # 4.47+ for processing_class in Trainer
    "sentencepiece>=0.2.0",

    # NLP
    "keybert>=0.8.5",
    "sentence-transformers>=4.0.0",
    "nltk>=3.9.0",

    # Wikipedia retrieval
    "wikipedia-api>=0.7.0",

    # LLM orchestration
    "google-genai>=1.0.0",

    # Backend
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",

    # Auth + database
    "supabase>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
training = [
    # Training & fine-tuning
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",

    # Data processing
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "evaluate>=0.4.6",

    # Evaluation metrics
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "sacrebleu>=2.4.0",

    # Notebooks & visualisation
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tqdm>=4.67.0",
    "tabulate>=0.9.0",
    "tensorboard>=2.18.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# On Linux: use the CUDA 12.4 wheel index.
# On macOS (Apple Silicon): fall back to PyPI, which ships MPS-capable ARM wheels.
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]